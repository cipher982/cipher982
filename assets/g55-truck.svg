<svg viewBox="0 0 640 308" width="640" height="308" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2011 Mercedes G55 AMG as-built hardware schematic">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: none; stroke: #21262d; }
      .grid-line { fill: none; stroke: #21262d; stroke-width: 0.5; opacity: 0.55; }
      .fg { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .accent { fill: #58a6ff; }
      .orange { fill: #f0883e; }
      .cyan { fill: #39c5cf; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, monospace; }

      .tf { fill: none; stroke: #8b949e; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .tf .ground { stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .tf .body { fill: #161b22; stroke: #e6edf3; stroke-width: 2.6; }
      .tf .glass { fill: rgba(88, 166, 255, 0.12); stroke: #8b949e; stroke-width: 1.7; }
      .tf .tire { fill: #0d1117; stroke: #e6edf3; stroke-width: 2.6; }
      .tg .dc { fill: rgba(240, 136, 62, 0.15); stroke: #f0883e; stroke-width: 2; }
      .tg .bus { fill: none; stroke: #39c5cf; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .tg .bus-b { fill: none; stroke: #76d7df; stroke-dasharray: 6 4; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .part .dc { fill: #f0883e; stroke: #0d1117; stroke-width: 1.5; }
      .ta .dp { fill: #58a6ff; stroke: #0d1117; stroke-width: 1.5; }
      .ta .de { fill: #39c5cf; stroke: #0d1117; stroke-width: 1.5; }
      .ta .wire-dp { fill: none; stroke: #58a6ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ta .wire-de { fill: none; stroke: #39c5cf; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #f6f8fa; }
        .frame { stroke: #d0d7de; }
        .grid-line { stroke: #d8dee4; opacity: 0.7; }
        .fg { fill: #1f2328; }
        .muted { fill: #636c76; }
        .accent { fill: #0969da; }
        .orange { fill: #bc4c00; }
        .cyan { fill: #0e7490; }
        .tf { stroke: #636c76; }
        .tf .ground { stroke: #d0d7de; }
        .tf .body { fill: #ffffff; stroke: #1f2328; }
        .tf .glass { fill: rgba(9, 105, 218, 0.10); stroke: #636c76; }
        .tf .tire { fill: #f6f8fa; stroke: #1f2328; }
        .tg .dc { fill: rgba(188, 76, 0, 0.12); stroke: #bc4c00; }
        .tg .bus { stroke: #0e7490; }
        .tg .bus-b { stroke: #0891b2; }
        .part .dc { fill: #bc4c00; stroke: #f6f8fa; }
        .ta .dp { fill: #0969da; stroke: #f6f8fa; }
        .ta .de { fill: #0e7490; stroke: #f6f8fa; }
        .ta .wire-dp { stroke: #0969da; }
        .ta .wire-de { stroke: #0e7490; }
      }
    </style>
    <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" class="grid-line"/>
    </pattern>
  </defs>

  <rect width="640" height="308" rx="6" class="bg"/>
  <rect width="640" height="308" rx="6" fill="url(#bp-grid)"/>
  <rect x="0.5" y="0.5" width="639" height="307" rx="6" class="frame"/>

  <text x="16" y="26" font-size="12" font-weight="700" class="mono fg">2011 G55 AMG (W463)</text>
  <text x="624" y="26" text-anchor="end" font-size="11" class="mono accent">N16 20 Hz · ME 2.8.1 50 Hz CAN</text>

  <g transform="translate(56, 16) scale(0.54)">
