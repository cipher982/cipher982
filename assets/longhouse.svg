<svg viewBox="0 0 640 360" width="640" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Longhouse multi-machine coding agent remote control">
  <defs>
    <radialGradient id="lh-glow" cx="85%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#e5b567" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#120f0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" rx="6" fill="#120f0c"/>
  <rect width="640" height="360" rx="6" fill="url(#lh-glow)"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="6" fill="none" stroke="#362b1f"/>

  <!-- Header -->
  <circle cx="28" cy="29" r="7" fill="#e5b567"/>
  <circle cx="28" cy="29" r="3" fill="#120f0c"/>
  <text x="44" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f3e9d8">Longhouse</text>
  <text x="160" y="34" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="12.5" fill="#9d8d78">remote agent control</text>

  <rect x="466" y="15" width="154" height="26" rx="13" fill="#1b261c" stroke="#2d5a35"/>
  <circle cx="482" cy="28" r="4" fill="#3fb950"/>
  <text x="494" y="32" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#8be098">3 live machines</text>

  <!-- Row 1 -->
  <rect x="20" y="66" width="600" height="62" rx="8" fill="#1b1611" stroke="#30271d"/>
  <circle cx="40" cy="97" r="5.5" fill="#e5b567"/>
  <text x="58" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5efe6">Claude Code</text>
  <text x="58" y="113" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#9d8d78">macbook · running tests</text>
  <rect x="464" y="81" width="140" height="32" rx="6" fill="#2e2416" stroke="#e5b567" stroke-width="1.4"/>
  <text x="534" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f6d89c">Live control</text>

  <!-- Row 2 -->
  <rect x="20" y="140" width="600" height="62" rx="8" fill="#1b1611" stroke="#30271d"/>
  <circle cx="40" cy="171" r="5.5" fill="#3fb950"/>
  <text x="58" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5efe6">Codex</text>
  <text x="58" y="187" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#9d8d78">gpu-box · editing auth.rs</text>
  <rect x="464" y="155" width="140" height="32" rx="6" fill="#2e2416" stroke="#e5b567" stroke-width="1.4"/>
  <text x="534" y="176" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f6d89c">Live control</text>

  <!-- Row 3 -->
  <rect x="20" y="214" width="600" height="62" rx="8" fill="#1b1611" stroke="#30271d"/>
  <circle cx="40" cy="245" r="5.5" fill="#58a6ff"/>
  <text x="58" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5efe6">Cursor</text>
  <text x="58" y="261" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#9d8d78">dev-vm · waiting on input</text>
  <rect x="464" y="229" width="140" height="32" rx="6" fill="#1b2432" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="534" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#93c5fd">Steer now</text>

  <!-- Bottom Steer Command Bar -->
  <rect x="20" y="296" width="600" height="46" rx="8" fill="#17130e" stroke="#e5b567" stroke-width="1.3"/>
  <text x="36" y="325" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="14.5" fill="#e9dcc7">&gt; Steer running CLI from web or iOS...</text>
  <rect x="532" y="302" width="80" height="34" rx="6" fill="#e5b567"/>
  <text x="572" y="324" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#120f0c">Send</text>
</svg>
