name: Update Profile Dashboard

# Manual-only trigger: the profile README uses curated visual cards in assets/
# rather than daily commit-wall auto-commits. Run link-check.yml on every push.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render README from template
        run: python3 scripts/generate_readme.py

      - name: Validate links
        run: python3 scripts/check_links.py README.md TEMPLATE.md

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: render profile README [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
